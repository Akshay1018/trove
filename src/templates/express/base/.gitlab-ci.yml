image: node:18

stages:
  - build
  - test
  - deploy

cache:
  paths:
    - node_modules/

build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/

test:
  stage: test
  services:
    - mongo:latest
  variables:
    MONGODB_URI: "mongodb://mongo:27017/test-db"
  script:
    - npm ci
    - npm test

deploy:
  stage: deploy
  script:
    - echo "Add your deployment commands here"
  only:
    - main 