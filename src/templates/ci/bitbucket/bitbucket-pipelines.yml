image: node:18

definitions:
  services:
    <% if (database === 'mongodb') { %>
    mongodb:
      image: mongo:latest
    <% } else if (database === 'postgres') { %>
    postgres:
      image: postgres:latest
      variables:
        POSTGRES_DB: test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
    <% } else if (database === 'mysql') { %>
    mysql:
      image: mysql:latest
      variables:
        MYSQL_DATABASE: test
        MYSQL_ROOT_PASSWORD: root
    <% } %>
  caches:
    npm: ~/.npm
  steps:
    - step: &build-test
        name: Build and Test
        caches:
          - npm
        script:
          - npm ci
          - npm run lint
          - npm run test:coverage
        artifacts:
          - dist/**
          - coverage/**
        services:
          <% if (database === 'mongodb') { %>
          - mongodb
          <% } else if (database === 'postgres') { %>
          - postgres
          <% } else if (database === 'mysql') { %>
          - mysql
          <% } %>

pipelines:
  default:
    - step: *build-test
  
  branches:
    main:
      - step: *build-test
      - step:
          name: Deploy to Production
          deployment: production
          script:
            - echo "Deploy to production environment"
          trigger: manual
    
    develop:
      - step: *build-test
      - step:
          name: Deploy to Staging
          deployment: staging
          script:
            - echo "Deploy to staging environment"

  pull-requests:
    '**':
      - step: *build-test

  custom:
    release:
      - step: *build-test
      - step:
          name: Create Release
          script:
            - npm version patch
            - git push && git push --tags 